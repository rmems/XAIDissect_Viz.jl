name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Julia CPU tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Install Xvfb/OpenGL deps
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 mesa-utils

      - name: Instantiate
        run: |
          xvfb-run -a julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Headless smoke load (no display required)
        run: julia --project=. -e 'using XAIDissectViz; println("XAIDissectViz loaded headlessly")'

      - name: Run tests
        env:
          XAIVIZ_CUDA_AVAILABLE: "false"
        run: julia --project=. -e 'using Pkg; Pkg.test(coverage=true)'

      - name: Process coverage
        run: julia -e 'using Pkg; Pkg.add("Coverage"); using Coverage; coverage = process_folder(); LCOV.writefile("lcov.info", coverage)'

      - name: Upload coverage
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
